plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zeubicardgames.riftbrawl'
    compileSdk 35

    defaultConfig {
        applicationId 'com.zeubicardgames.riftbrawl'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    sourceSets {
        main {
            assets.srcDirs = ['../web']
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
